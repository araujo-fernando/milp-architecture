[project]
name = "cvrp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fernando Araujo", email = "contato@fernando.bhz.br" }
]
requires-python = ">=3.12"
dependencies = [
    "cplex==22.2.0.0",
    "docplex>=2.32.264",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "--cov=cvrp --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I", "B", "UP"]

[project.scripts]
cvrp = "cvrp:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
